cabecas:
  jogadores:
    ativado: true
    chance: 25.0
    nome: "&fCabeça de %player%"
    lore:
      - ""
      - "&7Pertenceu a &f%player%&7."
      - ""

  # Desativa os drops customizados do plugin para mobs/animais.
  # O Wither Skeleton continua usando o drop padrão do Minecraft.
  drops-customizados: false
  mobs-e-animais: false
  chance: 100

# Núcleo de combate inspirado no PvP do Minecraft 1.8.
# Todos os módulos abaixo podem ser ajustados individualmente.
pvp-1-8:
  ataque-cooldown:
    # Neutraliza o attack cooldown das versões 1.9+.
    ativado: true
    # Valor alto = ataques praticamente sem intervalo, como na 1.8.
    velocidade: 100.0

  alcance:
    # Alcance de entidades usado pelo jogador. 3.0 é o alcance clássico do PvP 1.8.
    ativado: true
    distancia: 3.0

  # Nestes mundos, cada jogador começa com o PvP individual desativado.
  # O jogador pode ativá-lo usando /pvp.
  mundos-pvp-desativado-por-padrao:
    - world
    - mining

  bloqueio-espada:
    # Botão direito com qualquer espada ativa o bloqueio estilo Minecraft 1.8.
    ativado: true
    # 0.50 = 50% de redução de dano corpo a corpo.
    reducao-dano: 0.50
    # Se true, o jogador para de bloquear imediatamente após receber um hit.
    parar-ao-receber-hit: false
    animacao:
      # Usa a animação BLOCK do cliente para levantar a própria espada.
      ativado: true

  escudo:
    # A 1.8 não possuía escudos. Remove apenas a redução de dano
    # causada pelo bloqueio moderno, mantendo armadura/resistência.
    ignorar-bloqueio: true

mensagens:
  recarregado: "&a&lᴄᴏᴍʙᴀᴛᴇᴘʟᴜs &8• &aConfiguração recarregada."
  sem-permissao: "&c&lᴄᴏᴍʙᴀᴛᴇᴘʟᴜs &8• &cVocê não tem permissão."
  uso: "&e&lᴄᴏᴍʙᴀᴛᴇᴘʟᴜs &8• &fUse: &7/combateplus reload"
  apenas-jogadores: "&c&lᴄᴏᴍʙᴀᴛᴇᴘʟᴜs &8• &cApenas jogadores podem usar este comando."
  pvp-ativado: "&a&lᴘᴠᴘ &8• &fSeu PvP foi ativado."
  pvp-desativado: "&c&lᴘᴠᴘ &8• &fSeu PvP foi desativado."
  pvp-obrigatorio: "&c&lᴘᴠᴘ &8• &cO PvP é obrigatório nesta dimensão."
  pvp-obrigatorio-nether: "&c&lᴘᴠᴘ &8• &cO PvP é obrigatório no Nether."
  pvp-obrigatorio-end: "&5&lᴘᴠᴘ &8• &5O PvP é obrigatório no The End."
